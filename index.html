<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./image/pixel.png" type="image/x-icon">
    <script src="./script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
</head>
<body>
    <header>
        <div class="logo">Pixel Art</div>
    </header>
    <main>
        <div class="field">
            <button class="custom-btn btn-15">Начать</button>
            <div class="board"></div>
            <div class="container-btn">
                <div class="input"><input type="color" value="#ff0000"></div>
                <button class="btn pencil"><img src="./image/pencil.png" alt=""></button>
                <button class="btn eraser"><img src="./image/erase.png" alt=""></button>
                <button class="btn fill"><img src="./image/filler.png" alt=""></button>
                <button class="btn clear"><img src="./image/clear.png" alt=""></button>
                <button class="btn save"><img src="./image/save.png" alt=""></button>
                <button class="btn download"><img src="./image/download.png" alt=""></button>
            </div>
        </div>
    </main>
    <footer>
        <div>2026</div>
        <div>Pixel</div>
        <div><img class="git-ico" src="./image/github.png"></div>
    </footer>
    <script src='https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js'></script>
</body>
</html>
